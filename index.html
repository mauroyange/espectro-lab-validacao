<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Espectro LAB · Validação</title>
<meta name="description" content="Questionário da Espectro LAB para terapeutas, professores e famílias: ajude-nos a decidir que materiais construir primeiro. Cerca de 7 minutos, sem dados das crianças.">
<meta name="theme-color" content="#1F4FA0">
<meta property="og:title" content="Ajude-nos a construir o LAB certo">
<meta property="og:description" content="Questionário para terapeutas, professores e famílias. Cerca de 7 minutos, sem dados das crianças.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna de leitura (720px) para o questionário em passos; grelha de 12 colunas para o painel. Tokens do sistema visual Espectro LAB v2.1. */
:root{
  --fundo:#FFFFFF; --fundo-suave:#F3F5F9; --linha:#C9D0DC; --noite:#16213A; --texto-suave:#556076;
  --atlantico:#1F4FA0; --sobre-atlantico:#FFFFFF;
  --mangal:#18A08F; --mangal-texto:#0B6B60; --mel:#F2B53A; --barro:#E0613C; --barro-texto:#B23F22;
  --atlantico-tinta:#E6EDF9; --mangal-tinta:#E2F4F1; --mel-tinta:#FDF1D8; --barro-tinta:#FBE6DF;
  --mel-texto:#7A5300;
  --font-display:"Bricolage Grotesque","Lexend",system-ui,sans-serif;
  --font-texto:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --espaco-1:8px; --espaco-2:16px; --espaco-3:24px; --espaco-4:48px;
  --raio-pequeno:8px; --raio-medio:16px; --raio-pilula:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fundo:#0F1626; --fundo-suave:#18213A; --linha:#3A4766; --noite:#EEF1F7; --texto-suave:#A3ADC0;
  --atlantico:#86A8EE; --sobre-atlantico:#0F1626;
  --mangal:#3CC2B0; --mangal-texto:#5FD3C2; --mel:#F5C25E; --barro:#F0805E; --barro-texto:#F59A7C;
  --atlantico-tinta:#1C2A4A; --mangal-tinta:#14302F; --mel-tinta:#33290F; --barro-tinta:#3A1D14;
  --mel-texto:#F5C25E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fundo:#0F1626; --fundo-suave:#18213A; --linha:#3A4766; --noite:#EEF1F7; --texto-suave:#A3ADC0;
  --atlantico:#86A8EE; --sobre-atlantico:#0F1626;
  --mangal:#3CC2B0; --mangal-texto:#5FD3C2; --mel:#F5C25E; --barro:#F0805E; --barro-texto:#F59A7C;
  --atlantico-tinta:#1C2A4A; --mangal-tinta:#14302F; --mel-tinta:#33290F; --barro-tinta:#3A1D14;
  --mel-texto:#F5C25E; color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--fundo);color:var(--noite);font-family:var(--font-texto);font-size:17px;line-height:28px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fundo)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.2px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.08;font-weight:780;letter-spacing:-.5px}
h2{font-size:clamp(24px,4vw,32px);line-height:1.2;font-weight:700}
h3{font-size:20px;line-height:26px;font-weight:700}
p{margin:0}
a{color:var(--atlantico)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mel);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto}
.suave{color:var(--texto-suave)}
.rotulo{font-size:13px;line-height:18px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.legenda{font-size:13px;line-height:20px;color:var(--texto-suave)}
.num{font-variant-numeric:tabular-nums}

/* Cabeçalho */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fundo);border-bottom:1px solid var(--linha)}
.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--espaco-2);padding-block:12px;flex-wrap:wrap}
.logo{height:40px;width:auto;display:block}
.logo .txt{fill:var(--noite)} .logo .a1{stroke:var(--mel)} .logo .a2{stroke:var(--mangal)} .logo .a3{stroke:var(--atlantico)} .logo .pt{fill:var(--barro)}
.tabs{display:flex;gap:4px;background:var(--fundo-suave);padding:4px;border-radius:var(--raio-pilula)}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:var(--raio-pilula);font-size:14px;font-weight:600;cursor:pointer;color:var(--texto-suave)}
.tab[aria-selected="true"]{background:var(--fundo);color:var(--noite);box-shadow:0 0 0 1px var(--linha)}

/* Componentes da marca */
.el-botao{font-family:var(--font-texto);font-size:15px;font-weight:600;line-height:20px;display:inline-flex;align-items:center;gap:var(--espaco-1);padding:12px 22px;border-radius:var(--raio-pilula);border:2px solid transparent;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s}
.el-botao--primario{background:var(--atlantico);color:var(--sobre-atlantico)}
.el-botao--secundario{background:transparent;color:var(--noite);border-color:var(--linha)}
.el-botao--secundario:hover{border-color:var(--atlantico)}
.el-botao[disabled]{opacity:.45;cursor:not-allowed}
.el-etiqueta{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;border-radius:var(--raio-pilula);line-height:16px;white-space:nowrap}
.el-etiqueta::before{content:"";width:10px;height:10px;flex:none;box-sizing:border-box}
.el-etiqueta--terapeuta{background:var(--barro-tinta);color:var(--barro-texto)}
.el-etiqueta--terapeuta::before{background:var(--barro);border-radius:50%}
.el-etiqueta--familia{background:var(--mangal-tinta);color:var(--mangal-texto)}
.el-etiqueta--familia::before{border:3px solid var(--mangal-texto);border-radius:50%}
.el-etiqueta--professor{background:var(--mel-tinta);color:var(--noite)}
.el-etiqueta--professor::before{background:var(--mel);border:1.5px solid var(--noite);border-radius:2px}
.el-selo{display:inline-flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border:2px solid var(--noite);border-radius:var(--raio-pilula);background:var(--fundo)}
.el-selo svg{width:36px;height:36px;flex:none}
.el-selo .c{fill:none;stroke:var(--noite);stroke-width:2.5;stroke-linecap:round}
.el-selo .p{fill:var(--barro)}
.el-selo__t{display:flex;flex-direction:column}
.el-selo__titulo{font-size:14px;line-height:18px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.el-selo__sub{font-size:12px;line-height:16px;color:var(--texto-suave)}
.el-num{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;letter-spacing:.8px;color:var(--mangal-texto);border:1.5px solid var(--mangal-texto);border-radius:var(--raio-pilula);padding:2px 10px;line-height:18px;white-space:nowrap}
.el-pontos{background-image:radial-gradient(circle,var(--linha) 1.5px,transparent 1.6px);background-size:24px 24px}
.el-cartao{background:var(--fundo);border:1px solid var(--linha);border-radius:var(--raio-medio);padding:var(--espaco-3);display:flex;flex-direction:column;gap:var(--espaco-2)}

/* Ilustrações */
.ink{fill:none;stroke:var(--noite);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ink-f{fill:var(--fundo);stroke:var(--noite);stroke-width:2.5;stroke-linejoin:round}
.ink-s{fill:none;stroke:var(--texto-suave);stroke-width:2;stroke-linecap:round}
.f-mel{fill:var(--mel)} .f-mangal{fill:var(--mangal)} .f-barro{fill:var(--barro)} .f-atl{fill:var(--atlantico)}
.f-mel-t{fill:var(--mel-tinta)} .f-mangal-t{fill:var(--mangal-tinta)} .f-barro-t{fill:var(--barro-tinta)} .f-atl-t{fill:var(--atlantico-tinta)}
.f-linha{fill:var(--linha)} .f-suave{fill:var(--fundo-suave)} .f-noite{fill:var(--noite)} .f-fundo{fill:var(--fundo)}
.s-atl{stroke:var(--atlantico)} .s-mel{stroke:var(--mel)} .s-mangal{stroke:var(--mangal)} .s-barro{stroke:var(--barro)}

/* Abertura */
.abertura{padding-block:var(--espaco-4) var(--espaco-3)}
.abertura__grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:var(--espaco-4);align-items:center}
.abertura__txt{display:flex;flex-direction:column;gap:var(--espaco-2)}
.abertura__txt .lead{font-size:19px;line-height:30px;max-width:56ch}
.meta-linha{display:flex;flex-wrap:wrap;gap:var(--espaco-1) var(--espaco-2);align-items:center}
.fluxo{border-radius:var(--raio-medio);padding:var(--espaco-3);background-color:var(--fundo-suave);display:flex;flex-direction:column;gap:12px}
.fluxo__passo{display:grid;grid-template-columns:64px 1fr;gap:var(--espaco-2);align-items:center;background:var(--fundo);border:1px solid var(--linha);border-radius:var(--raio-medio);padding:12px var(--espaco-2)}
.fluxo__passo svg{width:64px;height:64px}
.fluxo__passo b{display:block;font-family:var(--font-display);font-size:18px;line-height:24px}
.fluxo__passo span{font-size:14px;line-height:22px;color:var(--texto-suave)}
.fluxo__seta{align-self:center;width:2px;height:12px;background:var(--linha)}

.escolha{padding-block:var(--espaco-3) var(--espaco-4)}
.escolha h2{margin-bottom:6px}
.audiencias{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--espaco-2);margin-top:var(--espaco-3)}
.aud{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--fundo);border:2px solid var(--linha);border-radius:var(--raio-medio);padding:var(--espaco-3);cursor:pointer;transition:border-color .15s,transform .15s}
.aud:hover{border-color:var(--atlantico)}
.aud[aria-pressed="true"]{border-color:var(--atlantico);background:var(--atlantico-tinta)}
.aud__forma{width:44px;height:44px}
.aud b{font-family:var(--font-display);font-size:22px;line-height:28px}
.aud span{font-size:15px;line-height:24px;color:var(--texto-suave)}
.inicio-accoes{display:flex;flex-wrap:wrap;gap:var(--espaco-2);align-items:center;margin-top:var(--espaco-3)}

/* Questionário */
.passos{padding-block:var(--espaco-3) var(--espaco-4)}
.progresso{display:flex;flex-direction:column;gap:10px;margin-bottom:var(--espaco-3)}
.progresso__barras{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.progresso__barras i{height:6px;border-radius:3px;background:var(--linha)}
.progresso__barras i.on{background:var(--atlantico)}
.progresso__topo{display:flex;justify-content:space-between;gap:var(--espaco-2);align-items:center;flex-wrap:wrap}
.passo__cab{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--espaco-3)}
.q{border:0;margin:0 0 var(--espaco-3);padding:var(--espaco-3);background:var(--fundo-suave);border-radius:var(--raio-medio);min-width:0}
.q legend,.q .q__t{float:left;width:100%;padding:0;font-weight:600;font-size:18px;line-height:27px;margin-bottom:4px}
.q legend+*{clear:both}
.q__ajuda{font-size:14px;line-height:22px;color:var(--texto-suave);margin-bottom:12px;clear:both}
.q__req{color:var(--barro-texto);font-weight:600;font-size:13px;margin-left:6px;white-space:nowrap}
.q--erro{box-shadow:inset 0 0 0 2px var(--barro-texto)}
.q__erro{display:none;color:var(--barro-texto);font-size:14px;font-weight:600;margin-top:10px}
.q--erro .q__erro{display:block}
.ops{display:flex;flex-wrap:wrap;gap:8px;clear:both}
.op{position:relative;cursor:pointer}
.op input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.op__c{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:1.5px solid var(--linha);border-radius:var(--raio-pilula);background:var(--fundo);font-size:15px;line-height:22px;transition:border-color .12s,background-color .12s}
.op__c::before{content:"";width:18px;height:18px;flex:none;border:2px solid var(--texto-suave);border-radius:50%;box-sizing:border-box;background:var(--fundo)}
.op input[type=checkbox]+.op__c::before{border-radius:5px}
.op:hover .op__c{border-color:var(--atlantico)}
.op input:checked+.op__c{border-color:var(--atlantico);background:var(--atlantico-tinta)}
.op input:checked+.op__c::before{border-color:var(--atlantico);background:var(--atlantico);box-shadow:inset 0 0 0 3px var(--fundo)}
.op input:focus-visible+.op__c{outline:3px solid var(--mel);outline-offset:2px}
.op input:disabled+.op__c{opacity:.45}
.ops--pic{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ops--pic.ops--4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.op--pic .op__c{flex-direction:column;align-items:stretch;gap:8px;padding:12px;border-radius:var(--raio-medio);height:100%}
.op--pic .op__c::before{position:absolute;top:12px;right:12px}
.op__ill{display:block;background:var(--fundo-suave);border-radius:var(--raio-pequeno);padding:8px}
.op__ill svg{display:block;width:100%;height:auto}
.op--pic .op__txt{font-weight:600;font-size:15px;line-height:20px;padding-right:4px}
.op--pic .op__sub{font-size:13px;line-height:18px;color:var(--texto-suave);font-weight:400}
.ops--icon{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ops--icon .op__c{flex-direction:column;gap:6px;padding:14px 8px 12px;border-radius:var(--raio-medio);text-align:center;font-size:14px;line-height:18px;font-weight:600;height:100%}
.ops--icon .op__c::before{position:absolute;top:8px;right:8px;width:16px;height:16px}
.ops--icon svg{width:48px;height:48px}
.escala{display:flex;gap:6px;flex-wrap:wrap;clear:both}
.escala .op{flex:1 1 0;min-width:40px}
.escala .op__c{justify-content:center;padding:10px 0;border-radius:var(--raio-pequeno);font-weight:600;font-variant-numeric:tabular-nums}
.escala .op__c::before{display:none}
.escala__ext{display:flex;justify-content:space-between;gap:var(--espaco-2);font-size:13px;line-height:18px;color:var(--texto-suave);margin-top:8px}
textarea,.campo{width:100%;font:inherit;font-size:16px;line-height:24px;color:var(--noite);background:var(--fundo);border:1.5px solid var(--linha);border-radius:var(--raio-pequeno);padding:12px 14px}
textarea{min-height:110px;resize:vertical}
textarea:focus,.campo:focus{outline:none;border-color:var(--atlantico);box-shadow:0 0 0 3px var(--atlantico-tinta)}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.campos label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.caixa{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px;line-height:24px;clear:both}
.caixa input{width:20px;height:20px;margin-top:2px;accent-color:var(--atlantico);flex:none}
.info{clear:both;display:flex;flex-direction:column;gap:12px}
.exemplo-cartao{max-width:380px;border:1px solid var(--linha);background:var(--fundo);border-radius:var(--raio-medio);padding:var(--espaco-3);display:flex;flex-direction:column;gap:12px;margin-bottom:var(--espaco-2)}
.exemplo-cartao__pic{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.exemplo-cartao__pic div{border:1.5px solid var(--noite);border-radius:6px;padding:4px 2px 2px;text-align:center;font-size:10px;line-height:12px;background:var(--fundo)}
.exemplo-cartao__pic svg{width:100%;height:auto;max-width:40px}
.pacote{clear:both;display:flex;flex-direction:column;gap:10px;background:var(--fundo);border:1px solid var(--linha);border-radius:var(--raio-medio);padding:var(--espaco-2);margin-bottom:var(--espaco-2)}
.pacote__itens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pacote__item{display:flex;gap:10px;align-items:center;min-width:0}
.pacote__item svg{width:40px;height:40px;flex:none}
.pacote__item b{display:block;font-size:14px;line-height:20px;font-weight:600}
.pacote__item small{display:block;font-size:13px;line-height:18px;color:var(--texto-suave)}
@media (max-width:640px){.pacote__itens{grid-template-columns:1fr}}
.navpassos{display:flex;justify-content:space-between;gap:var(--espaco-2);align-items:center;flex-wrap:wrap;margin-top:var(--espaco-3);padding-top:var(--espaco-3);border-top:1px solid var(--linha)}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--raio-medio);background:var(--atlantico-tinta);font-size:15px;line-height:24px}
.aviso--mel{background:var(--mel-tinta)}
.aviso b{font-weight:600}
.entrevista{display:flex;align-items:center;gap:10px;font-size:14px;line-height:20px;padding:8px 14px;border:1.5px dashed var(--linha);border-radius:var(--raio-pilula)}
.entrevista input{accent-color:var(--atlantico);width:18px;height:18px}

.obrigado{padding-block:var(--espaco-4)}
.obrigado__c{display:flex;flex-direction:column;gap:var(--espaco-2);align-items:flex-start}
.obrigado svg.arco{width:96px;height:96px}

/* Painel */
.painel{padding-block:var(--espaco-3) var(--espaco-4);display:flex;flex-direction:column;gap:var(--espaco-3)}
.painel__cab{display:flex;justify-content:space-between;gap:var(--espaco-2);flex-wrap:wrap;align-items:flex-end}
.filtros{display:flex;gap:var(--espaco-2);flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;gap:2px;background:var(--fundo-suave);border-radius:var(--raio-pilula);padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:var(--raio-pilula);font-size:13px;font-weight:600;cursor:pointer;color:var(--texto-suave)}
.seg button[aria-pressed="true"]{background:var(--fundo);color:var(--noite);box-shadow:0 0 0 1px var(--linha)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--espaco-2)}
.kpi{background:var(--fundo);border:1px solid var(--linha);border-radius:var(--raio-medio);padding:var(--espaco-3) var(--espaco-3) 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi__v{font-family:var(--font-display);font-size:40px;line-height:44px;font-weight:780;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi__v small{font-size:20px;font-weight:700}
.kpi__meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;line-height:18px;color:var(--texto-suave)}
.medidor{position:relative;height:8px;border-radius:4px;background:var(--fundo-suave);margin-top:6px}
.medidor i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--atlantico)}
.medidor b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--noite)}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:3px 10px 3px 6px;border-radius:var(--raio-pilula);white-space:nowrap}
.estado svg{width:14px;height:14px}
.estado--ok{background:var(--mangal-tinta);color:var(--mangal-texto)}
.estado--perto{background:var(--mel-tinta);color:var(--mel-texto)}
.estado--abaixo{background:var(--barro-tinta);color:var(--barro-texto)}
.grelha{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--espaco-3)}
.g6{grid-column:span 6}.g12{grid-column:span 12}.g4{grid-column:span 4}.g8{grid-column:span 8}
.bloco{background:var(--fundo);border:1px solid var(--linha);border-radius:var(--raio-medio);padding:var(--espaco-3);display:flex;flex-direction:column;gap:var(--espaco-2);min-width:0}
.bloco__cab{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.bloco__cab h3{font-size:18px;line-height:24px}
.legenda-aud{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;line-height:18px;color:var(--texto-suave)}
.legenda-aud span{display:inline-flex;align-items:center;gap:6px}
.forma{display:inline-block;width:10px;height:10px;flex:none;box-sizing:border-box}
.forma--terapeuta{background:var(--barro);border-radius:50%}
.forma--familia{border:3px solid var(--mangal);border-radius:50%}
.forma--professor{background:var(--mel);border:1.5px solid var(--noite);border-radius:2px}
.barras{display:flex;flex-direction:column;gap:10px}
.barra{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 76px;gap:12px;align-items:center;font-size:14px;line-height:20px}
.barra__l{min-width:0}
.barra__t{display:flex;gap:2px;height:14px;align-items:stretch;background:var(--fundo-suave);border-radius:0 4px 4px 0}
.barra__t i{display:block;height:100%;min-width:0}
.barra__t i:last-child{border-radius:0 4px 4px 0}
.barra__t i.terapeuta{background:var(--barro)} .barra__t i.familia{background:var(--mangal)} .barra__t i.professor{background:var(--mel)} .barra__t i.uma{background:var(--atlantico)}
.barra__v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.barra__v small{font-weight:400;color:var(--texto-suave)}
.nps-barra{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden}
.nps-barra i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.nps-d{background:var(--barro-tinta);color:var(--barro-texto)} .nps-p{background:var(--fundo-suave);color:var(--texto-suave)} .nps-pr{background:var(--mangal-tinta);color:var(--mangal-texto)}
.criterios{display:flex;flex-direction:column}
.criterio{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-top:1px solid var(--linha);align-items:center}
.criterio:first-child{border-top:0;padding-top:0}
.criterio__t{font-weight:600;font-size:15px;line-height:22px}
.criterio__d{font-size:13px;line-height:20px;color:var(--texto-suave);grid-column:1}
.pedidos{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow:auto;padding-right:4px}
.pedido{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:var(--raio-medio);background:var(--fundo-suave)}
.pedido p{font-size:15px;line-height:24px}
.pedido__m{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tabela-wrap{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--raio-medio)}
table{border-collapse:collapse;width:100%;font-size:13px;line-height:18px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
th{font-weight:600;color:var(--texto-suave);background:var(--fundo-suave);position:sticky;top:0}
tr:last-child td{border-bottom:0}
details summary{cursor:pointer;font-weight:600;font-size:15px}
.banda-exemplo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:12px 16px;border-radius:var(--raio-medio);background:var(--mel-tinta);border:1.5px dashed var(--mel);font-size:14px;line-height:22px}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.link-aud{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--raio-medio);background:var(--fundo-suave);min-width:0}
.link-aud code{font-size:12px;line-height:18px;word-break:break-all;color:var(--texto-suave)}
.dica{position:fixed;z-index:20;pointer-events:none;background:var(--noite);color:var(--fundo);font-size:13px;line-height:18px;padding:8px 10px;border-radius:8px;max-width:240px}
.rodape{border-top:1px solid var(--linha);padding-block:var(--espaco-3)}
.rodape .wrap{display:flex;justify-content:space-between;gap:var(--espaco-2);flex-wrap:wrap;align-items:center}
.entrar{display:flex;flex-direction:column;gap:var(--espaco-2);max-width:480px}
.entrar form{display:flex;gap:8px;flex-wrap:wrap}
.entrar .campo{flex:1 1 220px;width:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--noite);color:var(--fundo);padding:12px 20px;border-radius:var(--raio-pilula);font-size:14px;font-weight:600;z-index:30}

@media (max-width:860px){
  .abertura__grid{grid-template-columns:1fr;gap:var(--espaco-3)}
  .audiencias{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g6,.g4,.g8{grid-column:span 12}
  .links{grid-template-columns:1fr}
}
@media (max-width:520px){
  .kpis{grid-template-columns:1fr}
  .barra{grid-template-columns:minmax(0,1fr) 64px;gap:4px 10px}
  .barra__l{grid-column:1 / -1}
  .campos{grid-template-columns:1fr}
  .q{padding:var(--espaco-2)}
  .escala .op{min-width:36px}
  .logo{height:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

async function chamar(corpo, ms){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms||20000);
  try{
    // text/plain evita o pedido prévio de CORS, que o Apps Script não suporta.
    const res=await fetch(SHEETS_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(corpo),signal:ctl.signal});
    if(!res.ok) throw new Error("Erro do servidor ("+res.status+").");
    const d=await res.json(); if(!d.ok) throw Object.assign(new Error(d.error||"Resposta inválida."),{servidor:true});
    return d;
  } finally { clearTimeout(t); }
}

}

      <label class="caixa"><input type="checkbox" id="f-c_consent" name="c_consent"> Aceito que a equipa da Espectro LAB guarde estas respostas para estudar a ideia. As respostas não incluem dados de crianças e só a equipa as vê.</label>${erro}</div>`;
  let corpo="";

  } else if(q.type==="pic"){
    const t=q.multi?"checkbox":"radio";
    corpo=`<div class="ops ops--pic ${q.cols===4?"ops--4":""}">${q.opts.map(([v,l,k,sub])=>`<label class="op op--pic"><input type="${t}" name="${id}" value="${v}"><span class="op__c"><span class="op__ill">${ILL[k]}</span><span class="op__txt">${esc(l)}${sub?`<br><span class="op__sub">${esc(sub)}</span>`:""}</span></span></label>`).join("")}</div>`;
  } else if(q.type==="icon"){
    corpo=`<div class="ops ops--icon">${q.opts.map(([v,l,k])=>`<label class="op"><input type="checkbox" name="${id}" value="${v}"><span class="op__c">${pic(k)}<span>${esc(l)}</span></span></label>`).join("")}</div>`;
  } else if(q.type==="scale"||q.type==="nps"){
    const a=q.type==="nps"?0:1, b=q.type==="nps"?10:5, arr=[]; for(let n=a;n<=b;n++) arr.push(n);
    const ex = q.pre==="exemplo" ? exemploCartao() : "";

  }
  return `<fieldset class="q" data-id="${id}" aria-describedby="err-${id}"><legend>${esc(L(q))}${req}</legend>${ajuda}${corpo}${erro}</fieldset>`;

function preencher(){
  const f=$("#form"); if(!f) return;
  for(const [k,v] of Object.entries(st.a)){
    if(Array.isArray(v)) v.forEach(x=>{ const i=f.querySelector(`input[name="${k}"][value="${x}"]`); if(i) i.checked=true; });
    else if(k==="c_contacto"&&v){ const c=$("#f-c_quer"); if(c) c.checked=!!v.quer; if($("#f-c_nome")) $("#f-c_nome").value=v.nome||""; if($("#f-c_cont")) $("#f-c_cont").value=v.cont||""; }
    else if(k==="c_consent"){ const c=$("#f-c_consent"); if(c) c.checked=!!v; }
    else { const i=f.querySelector(`input[name="${k}"][value="${CSS.escape(String(v))}"]`); if(i) i.checked=true; const t=f.querySelector(`textarea[name="${k}"]`); if(t) t.value=v; }
  }
  qsDo(st.step).forEach(limitar);
}
function ler(q){
  const f=$("#form");
  if(q.type==="text") return f.querySelector(`[name="${q.id}"]`).value.trim();
  if(q.type==="contacto") return {quer:$("#f-c_quer").checked, nome:$("#f-c_nome").value.trim(), cont:$("#f-c_cont").value.trim()};
  if(q.type==="consent") return $("#f-c_consent").checked;
  if(q.type==="multi"||q.type==="icon"||(q.type==="pic"&&q.multi)) return [...f.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i=>i.value);
  const c=f.querySelector(`input[name="${q.id}"]:checked`); if(!c) return undefined;
  return (q.type==="scale"||q.type==="nps")?Number(c.value):c.value;
}
function limitar(q){
  if(!q.max) return;
  const box=[...document.querySelectorAll(`#form input[name="${q.id}"]`)];
  const n=box.filter(i=>i.checked).length;
  box.forEach(i=>{ if(!i.checked) i.disabled=n>=q.max; });
}
function actualizarVisiveis(){
  qsDo(st.step).forEach(q=>{ const el=document.querySelector(`.q[data-id="${q.id}"]`); if(el) el.hidden=!visivel(q); });
  const c=$("#campos-contacto"); if(c) c.hidden=!$("#f-c_quer").checked;
}
function guardarRascunho(){ if(!st.entrevista) gravarLocal("el-rascunho",{aud:st.aud,a:st.a}); }
function vazio(v){ return v===undefined||v===""||v===false||(Array.isArray(v)&&!v.length); }
function validar(){
  let primeiro=null;
  qsDo(st.step).forEach(q=>{
    const el=document.querySelector(`.q[data-id="${q.id}"]`); if(!el) return;
    const mau = q.req && visivel(q) && vazio(st.a[q.id]);
    el.classList.toggle("q--erro",mau);
    if(mau&&!primeiro) primeiro=el;
  });
  if(primeiro){ primeiro.scrollIntoView({behavior:"smooth",block:"center"}); const i=primeiro.querySelector("input,textarea"); if(i) i.focus({preventScroll:true}); return false; }
  return true;
}

async function enviar(){
  const a={};
  for(const q of Q){ if(q.aud&&!q.aud.includes(st.aud)) continue; if(!visivel(q)) continue; if(st.a[q.id]!==undefined) a[q.id]=st.a[q.id]; }
  const doc={aud:st.aud, a, ts:new Date().toISOString(), modo:st.entrevista?"entrevista":"proprio", v:1};
  const item={id:st.entrevista?uuid():meuId, doc};
  const btn=$("#btn-seg"); if(btn){ btn.disabled=true; btn.textContent="A enviar…"; }
  st.emFila=false;
  if(!SHEETS_URL){ reais.local.push(doc); gravarLocal("el-respostas-local",reais.local); }
  else {
    try{ await chamar({acao:"guardar",...item}); }
    catch(err){
      if(err.servidor){ if(btn){ btn.disabled=false; btn.textContent="Enviar respostas"; } toast(err.message); return; }
      const q=fila().filter(x=>x.id!==item.id); q.push(item); gravarLocal("el-fila",q); st.emFila=true;
    }
  }
  st.enviado=true; if(!st.entrevista){ st.existente=true; gravarLocal("el-minha",{aud:st.aud,a:st.a}); try{ localStorage.removeItem("el-rascunho"); }catch(e){} }
  render(); window.scrollTo({top:0});
  if(temChave()) carregarPainel();
}

document.addEventListener("click",e=>{
  const aud=e.target.closest(".aud");
  if(aud){ const novo=aud.dataset.aud; if(novo!==st.aud){ st.aud=novo; if(!st.existente) st.a={}; } render(); return; }
  if(e.target.closest("#btn-comecar")){ st.step=1; render(); window.scrollTo({top:0}); return; }
  if(e.target.closest("#btn-ant")){ st.step--; render(); window.scrollTo({top:0}); return; }
  if(e.target.closest("#btn-seg")){ if(!validar()) return; if(st.step===STEPS.length) enviar(); else { st.step++; render(); window.scrollTo({top:0}); } return; }
  if(e.target.closest("#btn-nova")){ st.a={}; st.aud=null; st.step=0; st.enviado=false; render(); window.scrollTo({top:0}); return; }
  if(e.target.closest("#btn-rever")){ st.enviado=false; st.step=1; render(); window.scrollTo({top:0}); return; }
  const tab=e.target.closest(".tab"); if(tab){ mostrar(tab.id==="tab-p"?"p":"q"); return; }
});
document.addEventListener("change",e=>{
  if(e.target.id==="chk-entrevista"){ st.entrevista=e.target.checked; if(st.entrevista){ st.a={}; st.aud=null; } render(); return; }
  onInput(e);
});
document.addEventListener("input",e=>{ if(e.target.matches("textarea,.campo")) onInput(e); });
function onInput(e){
  if(!e.target.closest("#form")) return;
  const name=e.target.name; let q=Q.find(x=>x.id===name);
  if(!q && ["c_quer","c_nome","c_cont"].includes(name)) q=Q.find(x=>x.id==="c_contacto");
  if(!q) return;
  st.a[q.id]=ler(q); limitar(q);
  const el=document.querySelector(`.q[data-id="${q.id}"]`); if(el&&!vazio(st.a[q.id])) el.classList.remove("q--erro");
  actualizarVisiveis(); guardarRascunho();
}

  $("#vista-q").hidden=v!=="q"; $("#vista-p").hidden=v!=="p";

}

function exemplo(){

  const pk=(arr,w)=>{ let t=r()*w.reduce((a,b)=>a+b,0); for(let i=0;i<arr.length;i++){ t-=w[i]; if(t<=0) return arr[i]; } return arr[arr.length-1]; };

    a.c_dores=mk(["tempo","lingua","custo","ferramentas","infra","personalizar","continuidade","saber"],aud===T?[.75,.45,.35,.3,.25,.5,.3,.05]:aud===PR?[.5,.35,.4,.35,.2,.35,.45,.45]:[.3,.25,.45,.35,.3,.3,.45,.55]).slice(0,3);
    a.c_disp=mk(["android","iphone","tablet","pc","impressora"],[.85,.2,.3,aud===F?.3:.65,aud===T?.45:.2]);
    a.c_net=pk(["sempre","falha","dados","raro"],[30,40,22,8]);

    if(!a.c_formatos.length) a.c_formatos=["agenda"];

    a.c_ellis=pk(["muito","algo","indif"],aud===T?[48,40,12]:aud===PR?[35,48,17]:[44,42,14]);
    a.c_nps=pk([5,6,7,8,9,10],[5,8,15,22,25,25]);
    a.c_priv=pk([3,4,5],[10,25,65]);
    a.c_boot=pk(["sim","talvez","nao"],aud===T?[55,35,10]:aud===PR?[35,45,20]:[40,40,20]);
    if(a.c_boot!=="nao") a.c_bootdia=mk(["sabm","sabd","sext","semana"],[.7,.25,.3,.15]);

async function carregarPainel(){
  if(!SHEETS_URL){ painel.estado="aberto"; desenharPainel(); return; }
  if(!chave()){ painel.estado="fechado"; desenharPainel(); return; }
  painel.estado=painel.estado==="aberto"?"aberto":"a-entrar"; painel.erro=""; desenharPainel();
  try{
    const d=await chamar({acao:"listar",chave:chave()},30000);
    reais.remotas=(d.respostas||[]).filter(r=>r&&AUD[r.aud]&&r.a);
    painel.estado="aberto"; painel.actualizado=new Date();
    if(pf.fonte===null||(!pf._mudou&&reais.remotas.length)){ pf.fonte=reais.remotas.length?"reais":"exemplo"; pf._mudou=true; }
  }catch(e){
    if(e.servidor){ try{ localStorage.removeItem("el-chave"); }catch(_){} painel.estado="fechado"; painel.erro="Chave errada. Confirme a chave que está no script da folha de respostas."; }
    else { painel.erro="Não foi possível ligar à folha de respostas. Verifique a internet e tente outra vez."; if(painel.estado!=="aberto") painel.estado="fechado"; }
  }

}

function contar(rows,qid,opts){
  const resp=rows.filter(r=>!vazio(r.a[qid]));
  const linhas=opts.map(([v,l])=>{ const c={terapeuta:0,professor:0,familia:0}; resp.forEach(r=>{ const x=r.a[qid]; if(Array.isArray(x)?x.includes(v):String(x)===String(v)) c[r.aud]++; }); return {v,l,c,t:c.terapeuta+c.professor+c.familia}; });
  return {n:resp.length, linhas};
}
function barras(rows,qid,opts,ordenar){
  const {n,linhas}=contar(rows,qid,opts);

document.addEventListener("mousemove",e=>{ const t=e.target.closest("[data-tip]"); if(!t){ dica.hidden=true; return; } dica.textContent=t.dataset.tip; dica.hidden=false; const x=Math.min(e.clientX+14,innerWidth-dica.offsetWidth-8); dica.style.left=x+"px"; dica.style.top=(e.clientY+14)+"px"; });

/* ---------- Arranque ---------- */
const h=(location.hash||"").slice(1);
if(AUD[h]){ if(st.aud!==h){ st.aud=h; st.a={}; } }
const minha=lerLocal("el-minha",null);
if(minha&&minha.aud){ st.existente=true; if(!Object.keys(st.a).length){ st.aud=minha.aud; st.a=minha.a||{}; } }
render();
// O separador do painel só aparece à equipa: com #painel no link ou com a chave já guardada neste dispositivo.
$("#tab-p").hidden = !(h==="painel" || chave());
if(h==="painel") mostrar("p");
if(chave()) carregarPainel();
esvaziarFila();
addEventListener("online",esvaziarFila);

// Funciona offline depois da primeira visita.
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
